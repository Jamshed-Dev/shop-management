{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Inventory Transactions</h1>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex gap-2 p-3">
        <select class="form-select form-select-sm" id="filterType" style="max-width: 200px;">
            <option value="">All Transactions</option>
            <option value="order_dispatch">Order Dispatch (-)</option>
            <option value="order_return">Order Return (+)</option>
            <option value="manual_adjustment">Manual Adjustment</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadInventory()">Apply Filter</button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Product / Variant</th>
                        <th>Type</th>
                        <th>Qty Chg</th>
                        <th>Stock After</th>
                        <th>Order</th>
                        <th>Reason</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr><td colspan="8" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="pageInfo">Showing results...</span>
        <div>
            <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>Previous</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>Next</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/inventory.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadInventory);
</script>
{% endblock %}
