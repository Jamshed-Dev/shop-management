<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f9f9f9; padding: 30px; border-radius: 5px; border: 1px solid #e0e0e0; text-align: center;">
        <h2 style="color: #2c3e50; margin-top: 0;">Verify Your Email Address</h2>
        <p>Thank you for registering. Please use the following verification code to complete your registration process:</p>
        
        <div style="background-color: #ffffff; border: 2px dashed #3498db; padding: 15px; margin: 20px 0; font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #3498db;">
            {{ code }}
        </div>
        
        <p style="font-size: 14px; color: #7f8c8d;">This code will expire in {{ expire_time }} minutes.</p>
        <p style="font-size: 14px; margin-bottom: 0;">If you did not request this code, you can safely ignore this email.</p>
    </div>
</body>
</html>
