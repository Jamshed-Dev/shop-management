{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2" id="pageTitle">Add Product Type</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="/product-types/" class="btn btn-sm btn-outline-secondary">
            Cancel
        </a>
    </div>
</div>

<div class="card shadow-sm max-w-lg mb-4 position-relative" style="max-width: 600px;">
    <div id="formLoadingOverlay" class="position-absolute w-100 h-100 d-none justify-content-center align-items-center bg-white" style="z-index: 10; opacity: 0.8; border-radius: 0.25rem;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <div class="card-body">
        <form id="typeForm">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required>
            </div>
            <div class="mb-3">
                <label for="slug" class="form-label">Slug</label>
                <input type="text" class="form-control" id="slug" placeholder="Auto-generated if empty">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="is_active" checked>
                <label class="form-check-label" for="is_active">Active</label>
            </div>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Product Type</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/product_types.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', initProductTypeForm);
</script>
{% endblock %}
