{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Orders</h1>
    <a href="/orders/create/" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Create Order</a>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex gap-2 p-3">
        <input type="text" class="form-control form-control-sm" id="searchOrder" placeholder="Search Order # or Customer..." style="max-width: 250px;">
        <select class="form-select form-select-sm" id="filterStatus" style="max-width: 150px;">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="processing">Processing</option>
            <option value="packed">Packed</option>
            <option value="dispatched">Dispatched</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
            <option value="returned">Returned</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadOrders()">Apply Filters</button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Payment</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span class="text-muted small" id="pageInfo">Showing results...</span>
        <div>
            <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>Previous</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>Next</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/orders.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadOrders);
</script>
{% endblock %}
