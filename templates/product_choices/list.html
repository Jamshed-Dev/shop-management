{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Product Choices</h1>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="choicesTableBody">
                    <tr><td colspan="3" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadChoices() {
    const tbody = document.getElementById('choicesTableBody');
    try {
        const data = await api.get('/product-choices/');
        const results = data.results || data;
        tbody.innerHTML = '';
        if(results.length === 0) {
            return tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="text-center py-5">
                        <div class="text-muted mb-2">No Product Choices Yet</div>
                        <p class="small">There are currently no product choices.</p>
                        <button class="btn btn-sm btn-primary" onclick="alert('Feature not implemented yet')">
                            <i class="bi bi-plus"></i> Add Product Choice
                        </button>
                    </td>
                </tr>`;
        }
        
        results.forEach(c => {
            tbody.innerHTML += `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.title}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary" onclick="alert('Feature not implemented yet')">View</button>
                        <button class="btn btn-sm btn-outline-primary" onclick="alert('Feature not implemented yet')">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteChoice(${c.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Failed to load</td></tr>';
    }
}
async function deleteChoice(id) {
    if(confirm('Delete choice?')) {
        await api.delete(`/product-choices/${id}/`);
        loadChoices();
    }
}
document.addEventListener('DOMContentLoaded', loadChoices);
</script>
{% endblock %}
