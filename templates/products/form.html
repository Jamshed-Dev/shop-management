{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <div class="d-flex align-items-center">
        <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary me-3">&larr; Back</a>
        <h1 class="h2 mb-0" id="pageTitle">Add Product</h1>
    </div>
        <a href="/products/" class="btn btn-sm btn-outline-secondary">
            Cancel
        </a>
    </div>
</div>

<div class="card shadow-sm mb-4 position-relative">
    <div id="formLoadingOverlay" class="position-absolute w-100 h-100 d-none justify-content-center align-items-center bg-white" style="z-index: 10; opacity: 0.8; border-radius: 0.25rem;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <div class="card-body">
        <form id="productForm">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="sku" class="form-label">SKU</label>
                            <input type="text" class="form-control" id="sku" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="slug" class="form-label">Slug</label>
                            <input type="text" class="form-control" id="slug" placeholder="Auto-generated if empty">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="collection" class="form-label">Collection</label>
                            <select class="form-select" id="collection" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="product_type" class="form-label">Product Type</label>
                            <select class="form-select" id="product_type" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="short_description" class="form-label">Short Description</label>
                        <textarea class="form-control" id="short_description" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Full Description</label>
                        <textarea class="form-control" id="description" rows="5"></textarea>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-header bg-light">Product Image</div>
                        <div class="card-body text-center">
                            <div class="mb-3">
                                <img id="imagePreview" src="/static/images/placeholder.png" alt="Preview" class="img-fluid rounded mb-2" style="max-height: 200px; object-fit: contain;">
                            </div>
                            <div class="mb-3 text-start">
                                <label for="image" class="form-label">Image Upload</label>
                                <input class="form-control" type="file" id="image" accept="image/*">
                            </div>
                            <div class="mb-2 text-start">
                                <label for="image_url" class="form-label">Or Image URL</label>
                                <input type="url" class="form-control" id="image_url" placeholder="https://...">
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-header bg-light">Pricing & Stock</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="main_price" class="form-label">Main Price</label>
                                <input type="number" step="0.01" class="form-control" id="main_price" required>
                            </div>
                            <div class="mb-3">
                                <label for="old_price" class="form-label">Old Price</label>
                                <input type="number" step="0.01" class="form-control" id="old_price">
                            </div>
                            <div class="mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" required>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-header bg-light">Visibility</div>
                        <div class="card-body">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="is_active" checked>
                                <label class="form-check-label" for="is_active">Active</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="is_featured">
                                <label class="form-check-label" for="is_featured">Featured</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/products.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', initProductForm);
</script>
{% endblock %}
