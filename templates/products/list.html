{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Products</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="/products/create/" class="btn btn-sm btn-primary">
            <i class="bi bi-plus"></i> Add Product
        </a>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex gap-2 p-3">
        <input type="text" class="form-control form-control-sm" id="searchTitle" placeholder="Search title or SKU..." style="max-width: 250px;">
        <select class="form-select form-select-sm" id="filterStatus" style="max-width: 150px;">
            <option value="">All Statuses</option>
            <option value="true">Active</option>
            <option value="false">Inactive</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">Apply Filters</button>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">Image</th>
                        <th>SKU</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center" id="paginationControls">
        <span class="text-muted small" id="pageInfo">Showing results...</span>
        <div>
            <button class="btn btn-sm btn-outline-secondary" id="prevPage" disabled>Previous</button>
            <button class="btn btn-sm btn-outline-secondary" id="nextPage" disabled>Next</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/products.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadProducts);
</script>
{% endblock %}
