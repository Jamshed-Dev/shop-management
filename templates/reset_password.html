<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Shop Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <form id="resetPasswordForm">
            <h1 class="auth-brand mb-2">Set New Password</h1>
            <p class="text-center text-muted small mb-4">Enter your new password below.</p>
            
            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="newPassword" placeholder="New Password" required minlength="8" style="padding-right: 40px;">
                <label for="newPassword">New Password</label>
                <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="toggleNewPassword" style="cursor: pointer; z-index: 10;"></i>
            </div>
            
            <div class="form-floating mb-4 position-relative">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required minlength="8" style="padding-right: 40px;">
                <label for="confirmPassword">Confirm Password</label>
                <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="toggleConfirmPassword" style="cursor: pointer; z-index: 10;"></i>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitBtn">Save Password</button>
        </form>
    </div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    function setupPasswordToggle(toggleId, inputId) {
        const toggleBtn = document.getElementById(toggleId);
        const inputField = document.getElementById(inputId);
        if (toggleBtn && inputField) {
            toggleBtn.addEventListener('click', function () {
                const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
                inputField.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
        }
    }
    setupPasswordToggle('toggleNewPassword', 'newPassword');
    setupPasswordToggle('toggleConfirmPassword', 'confirmPassword');

    const email = sessionStorage.getItem('resetEmail');
    const token = sessionStorage.getItem('resetToken');
    const code = sessionStorage.getItem('resetCode');
    
    if(!email || !token || !code) {
        window.location.href = '/forgot-password/';
        return;
    }
    
    const form = document.getElementById('resetPasswordForm');
    const errorAlert = document.getElementById('errorAlert');
    
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = document.getElementById('submitBtn');
        
        errorAlert.classList.add('d-none');
        
        if (newPassword !== confirmPassword) {
            errorAlert.classList.remove('d-none');
            errorAlert.textContent = "Passwords do not match.";
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
        
        try {
            const response = await fetch('/auth/password-reset/reset/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: email, 
                    code: code, 
                    token: token,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                sessionStorage.removeItem('resetEmail');
                sessionStorage.removeItem('resetToken');
                sessionStorage.removeItem('resetCode');
                
                sessionStorage.setItem('resetSuccess', 'true');
                window.location.href = '/login/';
            } else {
                throw data;
            }
        } catch (err) {
            errorAlert.classList.remove('d-none');
            errorAlert.textContent = extractErrorMessage(err) || 'Failed to reset password.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Save Password';
        }
    });
});
</script>
</body>
</html>
