<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shop Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <form id="loginForm">
            <h1 class="auth-brand">Shop Admin</h1>
            <p class="text-center text-muted mb-4">Sign in to manage your store</p>
            
            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>
            
            <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="password" placeholder="Password" required style="padding-right: 40px;">
                <label for="password">Password</label>
                <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="togglePassword" style="cursor: pointer; z-index: 10;"></i>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="/forgot-password/" class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitBtn">Sign in</button>
            <p class="mt-4 mb-0 text-center text-muted small">&copy; 2026 Shop Management</p>
        </form>
    </div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        if (togglePassword && password) {
            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
        }

        if(sessionStorage.getItem('resetSuccess')) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.className = 'alert alert-success';
            errorAlert.textContent = 'Password reset successfully. Please log in.';
            errorAlert.classList.remove('d-none');
            sessionStorage.removeItem('resetSuccess');
        }
    });
</script>
</body>
</html>
