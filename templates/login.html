<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shop Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --dark: #0f172a;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: #ffffff;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.12);
            border-radius: 1.5rem;
            border: 1px solid rgba(226, 232, 240, 0.9);
            position: relative;
            z-index: 10;
        }

        .auth-brand {
            font-weight: 800;
            font-size: 1.85rem;
            background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.35rem;
            text-align: center;
        }

        .demo-box {
            background-color: #f0f7ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 1.25rem;
        }

        .btn-primary {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
            padding: 0.75rem 1.25rem;
            font-weight: 700;
            border-radius: 0.65rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover) !important;
            border-color: var(--primary-hover) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
        }

        .form-floating .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <form id="loginForm">
            <h1 class="auth-brand"><i class="bi bi-bag-check-fill me-1"></i> Shop Admin</h1>
            <p class="text-center text-muted mb-3" style="font-size: 0.95rem;">Sign in to access store management</p>
            
            <!-- Demo Credentials Box -->
            <div class="demo-box text-start">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="fw-bold text-primary small">
                        <i class="bi bi-person-badge-fill me-1"></i> Demo Credentials
                    </span>
                    <button type="button" class="btn btn-sm btn-primary py-0 px-2 fw-semibold" id="fillDemoBtn" style="font-size: 0.75rem; border-radius: 6px;">
                        Quick Fill
                    </button>
                </div>
                <div class="small text-secondary" style="font-size: 0.85rem;">
                    <div>Email: <strong class="text-dark font-monospace">admin@gmail.com</strong></div>
                    <div>Password: <strong class="text-dark font-monospace">admin</strong></div>
                </div>
            </div>

            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" value="admin@gmail.com" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>
            
            <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="password" value="admin" placeholder="Password" required style="padding-right: 40px;">
                <label for="password">Password</label>
                <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="togglePassword" style="cursor: pointer; z-index: 10;"></i>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe" checked>
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="/forgot-password/" class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitBtn">Sign in</button>
            
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Back to Public Store
                </a>
            </div>

            <p class="mt-3 mb-0 text-center text-muted small">&copy; 2026 Shop Management</p>
        </form>
    </div>
</div>

<!-- Self-Contained JavaScript for Login & API Support -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        if (togglePassword && password) {
            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
        }

        const fillDemoBtn = document.getElementById('fillDemoBtn');
        if (fillDemoBtn) {
            fillDemoBtn.addEventListener('click', () => {
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                if (emailInput) emailInput.value = 'admin@gmail.com';
                if (passwordInput) passwordInput.value = 'admin';
            });
        }

        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const pwd = document.getElementById('password').value;
                const submitBtn = document.getElementById('submitBtn');
                const errorAlert = document.getElementById('errorAlert');
                
                errorAlert.classList.add('d-none');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
                
                try {
                    const response = await fetch('/auth/jwt/create/', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ email: email, password: pwd })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.access) {
                        localStorage.setItem('access_token', data.access);
                        if (data.refresh) localStorage.setItem('refresh_token', data.refresh);
                        
                        // Set cookies for Django JWTRequiredMixin authentication
                        const isHttps = window.location.protocol === 'https:';
                        const secureFlag = isHttps ? '; Secure' : '';
                        document.cookie = `access=${data.access}; path=/; max-age=2592000; SameSite=Lax${secureFlag}`;
                        if (data.refresh) {
                            document.cookie = `refresh=${data.refresh}; path=/; max-age=2592000; SameSite=Lax${secureFlag}`;
                        }
                        
                        const urlParams = new URLSearchParams(window.location.search);
                        const nextUrl = urlParams.get('next');
                        if (nextUrl && nextUrl.startsWith('/') && nextUrl !== '/login/') {
                            window.location.href = nextUrl;
                        } else {
                            window.location.href = '/dashboard/';
                        }
                    } else {
                        const errMsg = data.detail || (data.non_field_errors && data.non_field_errors[0]) || 'Invalid email or password.';
                        throw new Error(errMsg);
                    }
                } catch (err) {
                    errorAlert.classList.remove('d-none');
                    errorAlert.textContent = err.message || 'Login failed. Please check credentials or network.';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                }
            });
        }
    });
</script>
</body>
</html>
