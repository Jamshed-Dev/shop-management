<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shop Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <form id="loginForm">
            <h1 class="auth-brand">Shop Admin</h1>
            <p class="text-center text-muted mb-3">Sign in to manage your store</p>
            
            <!-- Demo Credentials Box -->
            <div class="alert alert-info border-0 rounded-3 p-3 mb-3 text-start" style="background-color: #eff6ff; border: 1px solid #bfdbfe !important;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold text-primary small">
                        <i class="bi bi-person-badge-fill me-1"></i> Demo Credentials
                    </span>
                    <button type="button" class="btn btn-sm btn-primary py-0 px-2 fw-semibold" id="fillDemoBtn" style="font-size: 0.75rem; border-radius: 6px;">
                        Quick Fill
                    </button>
                </div>
                <div class="small text-secondary" style="font-size: 0.85rem;">
                    <div>Email: <strong class="text-dark font-monospace">admin@gmail.com</strong></div>
                    <div>Password: <strong class="text-dark font-monospace">admin</strong></div>
                </div>
            </div>

            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" value="admin@gmail.com" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>
            
            <div class="form-floating mb-3 position-relative">
                <input type="password" class="form-control" id="password" value="admin" placeholder="Password" required style="padding-right: 40px;">
                <label for="password">Password</label>
                <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="togglePassword" style="cursor: pointer; z-index: 10;"></i>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe" checked>
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="/forgot-password/" class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitBtn">Sign in</button>
            
            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Back to Public Store
                </a>
            </div>

            <p class="mt-3 mb-0 text-center text-muted small">&copy; 2026 Shop Management</p>
        </form>
    </div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');
        if (togglePassword && password) {
            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
        }

        const fillDemoBtn = document.getElementById('fillDemoBtn');
        if (fillDemoBtn) {
            fillDemoBtn.addEventListener('click', () => {
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                if (emailInput) emailInput.value = 'admin@gmail.com';
                if (passwordInput) passwordInput.value = 'admin';
            });
        }

        if(sessionStorage.getItem('resetSuccess')) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.className = 'alert alert-success';
            errorAlert.textContent = 'Password reset successfully. Please log in.';
            errorAlert.classList.remove('d-none');
            sessionStorage.removeItem('resetSuccess');
        }
    });
</script>
</body>
</html>
