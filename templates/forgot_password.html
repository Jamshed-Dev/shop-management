<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Shop Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <form id="forgotPasswordForm">
            <h1 class="auth-brand mb-2">Reset Password</h1>
            <p class="text-center text-muted small mb-4">Enter your email address to receive a verification code.</p>
            
            <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

            <div class="form-floating mb-4">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-3" type="submit" id="submitBtn">Send Code</button>
            <div class="text-center">
                <a href="/login/" class="text-decoration-none small text-muted hover-primary">Back to Login</a>
            </div>
        </form>
    </div>
</div>

<!-- Toast Notification Container -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
    </div>
</div>

<script src="{% static 'js/api.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('forgotPasswordForm');
    
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorAlert = document.getElementById('errorAlert');
            
            errorAlert.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending...';
            
            try {
                const response = await fetch('/auth/password-reset/send-code/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    sessionStorage.setItem('resetEmail', data.email);
                    sessionStorage.setItem('resetToken', data.token);
                    window.location.href = '/verify-code/';
                } else {
                    throw data;
                }
            } catch (err) {
                errorAlert.classList.remove('d-none');
                errorAlert.textContent = extractErrorMessage(err) || 'Failed to send reset code.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Code';
            }
        });
    }
});
</script>
</body>
</html>
